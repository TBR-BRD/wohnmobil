# Wohnmobil – Helfer, berechnete Sensoren und Automatisierungen
#
# Einbinden in configuration.yaml:
#   homeassistant:
#     packages: !include_dir_named packages
#
# Entitäts-IDs: siehe docs/entitaeten.md

input_boolean:
  wm_alarm:
    name: Alarm scharf
    icon: mdi:shield-home

input_number:
  wm_gas_hoehe_leer:
    name: Gas Füllhöhe leer
    min: 0
    max: 100
    step: 1
    unit_of_measurement: mm
    mode: box
    icon: mdi:gas-cylinder
  wm_gas_hoehe_voll:
    name: Gas Füllhöhe voll
    min: 50
    max: 600
    step: 1
    unit_of_measurement: mm
    mode: box
    icon: mdi:gas-cylinder
  wm_gas_warnschwelle:
    name: Gas Warnschwelle
    min: 5
    max: 50
    step: 5
    unit_of_measurement: "%"
    mode: slider
    icon: mdi:gas-cylinder
  wm_batterie_warnschwelle:
    name: Batterie Warnschwelle
    min: 10
    max: 50
    step: 5
    unit_of_measurement: "%"
    mode: slider
    icon: mdi:battery-alert
  wm_frost_schwelle:
    name: Frostschwelle innen
    min: -5
    max: 10
    step: 0.5
    unit_of_measurement: "°C"
    mode: slider
    icon: mdi:snowflake-alert

template:
  - sensor:
      - name: Gas Füllstand
        unique_id: wm_gas_fuellstand
        default_entity_id: sensor.wm_gas_fuellstand
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:gas-cylinder
        availability: "{{ has_value('sensor.wm_gas_hoehe') }}"
        state: >
          {% set h = states('sensor.wm_gas_hoehe') | float(0) %}
          {% set leer = states('input_number.wm_gas_hoehe_leer') | float(0) %}
          {% set voll = states('input_number.wm_gas_hoehe_voll') | float(300) %}
          {% if voll <= leer %}
            {{ none }}
          {% else %}
            {{ ([0, [100, (h - leer) / (voll - leer) * 100] | min] | max) | round(0) }}
          {% endif %}

      # Verbrauch im Bordnetz = Solarleistung − Batterieleistung
      # (Batterieleistung: + = laden, − = entladen)
      - name: Verbrauch
        unique_id: wm_verbrauch
        default_entity_id: sensor.wm_verbrauch
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        icon: mdi:power-plug
        availability: >
          {{ has_value('sensor.wm_batterie_leistung') and has_value('sensor.wm_solar_leistung') }}
        state: >
          {{ [0, (states('sensor.wm_solar_leistung') | float(0)
                 - states('sensor.wm_batterie_leistung') | float(0))] | max | round(0) }}

  - binary_sensor:
      - name: Gas niedrig
        unique_id: wm_gas_niedrig
        default_entity_id: binary_sensor.wm_gas_niedrig
        device_class: problem
        icon: mdi:gas-cylinder
        availability: "{{ has_value('sensor.wm_gas_fuellstand') }}"
        state: >
          {{ states('sensor.wm_gas_fuellstand') | float(100)
             < states('input_number.wm_gas_warnschwelle') | float(20) }}

      - name: Batterie niedrig
        unique_id: wm_batterie_niedrig
        default_entity_id: binary_sensor.wm_batterie_niedrig
        device_class: battery
        availability: "{{ has_value('sensor.wm_batterie_soc') }}"
        state: >
          {{ states('sensor.wm_batterie_soc') | float(100)
             < states('input_number.wm_batterie_warnschwelle') | float(20) }}

      - name: Frostgefahr
        unique_id: wm_frostgefahr
        default_entity_id: binary_sensor.wm_frostgefahr
        device_class: cold
        availability: "{{ has_value('sensor.wm_innen_temperatur') }}"
        state: >
          {{ states('sensor.wm_innen_temperatur') | float(20)
             < states('input_number.wm_frost_schwelle') | float(3) }}

      - name: Sensor-Batterie niedrig
        unique_id: wm_sensor_batterie_niedrig
        default_entity_id: binary_sensor.wm_sensor_batterie_niedrig
        device_class: battery
        state: >
          {% set ids = ['sensor.wm_ht_batterie', 'sensor.wm_tuer_batterie',
                        'sensor.wm_bewegung_batterie', 'sensor.wm_gas_sensor_batterie'] %}
          {{ ids | select('has_value') | map('states') | map('float', 100)
             | select('lt', 20) | list | count > 0 }}

script:
  wm_melden:
    alias: Wohnmobil – Meldung senden
    icon: mdi:message-alert
    mode: queued
    fields:
      titel:
        description: Überschrift
        example: Wohnmobil
      text:
        description: Meldungstext
        example: Gas fast leer
    sequence:
      - action: persistent_notification.create
        data:
          title: "{{ titel | default('Wohnmobil') }}"
          message: "{{ text }}"
      # Ziel nach Bedarf anpassen, z. B. notify.mobile_app_<handy>
      - action: notify.notify
        continue_on_error: true
        data:
          title: "{{ titel | default('Wohnmobil') }}"
          message: "{{ text }}"

automation:
  - id: wm_alarm_tuer
    alias: Wohnmobil – Alarm Tür geöffnet
    triggers:
      - trigger: state
        entity_id: binary_sensor.wm_tuer
        to: "on"
    conditions:
      - condition: state
        entity_id: input_boolean.wm_alarm
        state: "on"
    actions:
      - action: script.wm_melden
        data:
          titel: "🚨 Wohnmobil"
          text: "Tür/Fenster wurde geöffnet."

  - id: wm_alarm_bewegung
    alias: Wohnmobil – Alarm Bewegung
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: binary_sensor.wm_bewegung
        to: "on"
    conditions:
      - condition: state
        entity_id: input_boolean.wm_alarm
        state: "on"
    actions:
      - action: script.wm_melden
        data:
          titel: "🚨 Wohnmobil"
          text: "Bewegung im Wohnmobil erkannt."
      - delay: "00:05:00"

  - id: wm_warnung_gas
    alias: Wohnmobil – Gas fast leer
    triggers:
      - trigger: state
        entity_id: binary_sensor.wm_gas_niedrig
        to: "on"
        for: "00:10:00"
    actions:
      - action: script.wm_melden
        data:
          text: "Gas fast leer: {{ states('sensor.wm_gas_fuellstand') }} %"

  - id: wm_warnung_batterie
    alias: Wohnmobil – Batterie niedrig
    triggers:
      - trigger: state
        entity_id: binary_sensor.wm_batterie_niedrig
        to: "on"
        for: "00:05:00"
    actions:
      - action: script.wm_melden
        data:
          text: "Batterie niedrig: {{ states('sensor.wm_batterie_soc') }} %"

  - id: wm_warnung_frost
    alias: Wohnmobil – Frostgefahr
    triggers:
      - trigger: state
        entity_id: binary_sensor.wm_frostgefahr
        to: "on"
        for: "00:15:00"
    actions:
      - action: script.wm_melden
        data:
          titel: "❄️ Wohnmobil"
          text: "Frostgefahr: innen {{ states('sensor.wm_innen_temperatur') }} °C"

  - id: wm_warnung_sensorbatterie
    alias: Wohnmobil – Sensor-Batterie schwach
    triggers:
      - trigger: state
        entity_id: binary_sensor.wm_sensor_batterie_niedrig
        to: "on"
    actions:
      - action: script.wm_melden
        data:
          text: "Mindestens ein Sensor im Wohnmobil hat schwache Batterie."
